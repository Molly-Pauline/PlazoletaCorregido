spring.application.name=plazoleta-de-comidas
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:plazoleta;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.auth.secret=${AUTH_SECRET:}
app.usuarios.base-url=${USUARIOS_BASE_URL:http://localhost:8081}
app.usuarios.owner-validation-path=${USUARIOS_OWNER_VALIDATION_PATH:/api/v1/usuarios/{id}/validacion-propietario}