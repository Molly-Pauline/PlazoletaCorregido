spring.application.name=Plazoleta
server.port=${PORT:8080}


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


#Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/plazoleta_bd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Camilo-11}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#Configuración de JPA (Hibernate detecta el dialecto de MySQL automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.admin-registration-enabled=${ADMIN_REGISTRATION_ENABLED:false}
# Opcional: inicializacion del primer administrador al arrancar
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
spring.jpa.show-sql=${SQL_LOGGING:false}
